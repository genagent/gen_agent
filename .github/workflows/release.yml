name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  verify-ci:
    name: Verify current main passed CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    outputs:
      current: ${{ steps.main.outputs.current }}
    steps:
      - name: Match successful CI to current main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current_sha" == "$PASSED_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs: verify-ci
    if: ${{ needs.verify-ci.outputs.current == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      core_tag: ${{ steps.release.outputs.tag_name }}
      claude_tag: ${{ steps.release.outputs['integrations/claude--tag_name'] }}
      codex_tag: ${{ steps.release.outputs['integrations/codex--tag_name'] }}
      anthropic_tag: ${{ steps.release.outputs['integrations/anthropic--tag_name'] }}
      openai_tag: ${{ steps.release.outputs['integrations/openai--tag_name'] }}
      ensemble_tag: ${{ steps.release.outputs['extensions/ensemble--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-core:
    name: Publish core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    steps:
      - name: Require core release tag
        if: ${{ contains(fromJSON(needs.release-please.outputs.paths_released), '.') }}
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.core_tag }}
        run: test -n "$RELEASE_TAG"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.core_tag }}
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Prepare core if released
        id: prepare
        if: ${{ contains(fromJSON(needs.release-please.outputs.paths_released), '.') }}
        run: scripts/publish-package.sh . prepare

      - name: Publish core if absent from Hex
        if: ${{ contains(fromJSON(needs.release-please.outputs.paths_released), '.') && steps.prepare.outputs.already_published == 'false' }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: scripts/publish-package.sh . publish

  publish-integrations:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [release-please, publish-core]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: integrations/claude
            tag_output: claude_tag
          - package: integrations/codex
            tag_output: codex_tag
          - package: integrations/anthropic
            tag_output: anthropic_tag
          - package: integrations/openai
            tag_output: openai_tag
    steps:
      - name: Require integration release tag
        if: ${{ contains(fromJSON(needs.release-please.outputs.paths_released), matrix.package) }}
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs[matrix.tag_output] }}
        run: test -n "$RELEASE_TAG"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs[matrix.tag_output] }}
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Prepare integration if released
        id: prepare
        if: ${{ contains(fromJSON(needs.release-please.outputs.paths_released), matrix.package) }}
        run: scripts/publish-package.sh "${{ matrix.package }}" prepare

      - name: Publish integration if absent from Hex
        if: ${{ contains(fromJSON(needs.release-please.outputs.paths_released), matrix.package) && steps.prepare.outputs.already_published == 'false' }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: scripts/publish-package.sh "${{ matrix.package }}" publish

  publish-ensemble:
    name: Publish Ensemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [release-please, publish-integrations]
    if: ${{ needs.release-please.outputs.releases_created == 'true' && contains(fromJSON(needs.release-please.outputs.paths_released), 'extensions/ensemble') }}
    steps:
      - name: Require Ensemble release tag
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.ensemble_tag }}
        run: test -n "$RELEASE_TAG"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.ensemble_tag }}
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Prepare Ensemble
        id: prepare
        run: scripts/publish-package.sh extensions/ensemble prepare

      - name: Publish Ensemble if absent from Hex
        if: ${{ steps.prepare.outputs.already_published == 'false' }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: scripts/publish-package.sh extensions/ensemble publish
