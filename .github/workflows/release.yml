name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-core:
    name: Publish core
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Publish core if released
        if: ${{ contains(fromJSON(needs.release-please.outputs.paths_released), '.') }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: scripts/publish-package.sh .

  publish-integrations:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: [release-please, publish-core]
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - integrations/claude
          - integrations/codex
          - integrations/anthropic
          - integrations/openai
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Publish integration if released
        if: ${{ contains(fromJSON(needs.release-please.outputs.paths_released), matrix.package) }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: scripts/publish-package.sh "${{ matrix.package }}"

  publish-ensemble:
    name: Publish Ensemble
    runs-on: ubuntu-latest
    needs: [release-please, publish-integrations]
    if: ${{ needs.release-please.outputs.releases_created == 'true' && contains(fromJSON(needs.release-please.outputs.paths_released), 'extensions/ensemble') }}
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Publish Ensemble
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: scripts/publish-package.sh extensions/ensemble
