name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_examples: ${{ steps.classify.outputs.run_examples }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify example-relevant changes
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-example-scope.sh

  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19"
            otp: "27"
          - elixir: "1.20"
            otp: "29"

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Run core quality gates
        run: bash scripts/quality.sh .

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Restore deps cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-docs-1.19-27-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Build docs
        run: mix docs --warnings-as-errors

  example:
    name: GenAgent app example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.run_examples == 'true') }}
    defaults:
      run:
        working-directory: examples/gen_agent_app
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run example tests
        run: mix test

      - name: Boot Claude and Codex agents
        run: |
          GEN_AGENT_APP_PROVIDERS=claude,codex GEN_AGENT_APP_CWD="$GITHUB_WORKSPACE" \
            mix run -e 'case GenAgentApp.agents() do {:ok, ["claude", "codex"]} -> :ok; other -> raise inspect(other) end'

  primitives:
    name: GenAgent primitive examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.run_examples == 'true') }}
    defaults:
      run:
        working-directory: examples/primitives
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run primitive examples
        run: bash scripts/run_all.sh

  chaos_lab:
    name: GenAgent chaos lab
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.run_examples == 'true') }}
    defaults:
      run:
        working-directory: examples/chaos_lab
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run chaos lab
        run: |
          set -euo pipefail
          mix run scripts/chaos_lab.exs | tee chaos_lab.log
          test "$(tail -n 1 chaos_lab.log)" = 'chaos_lab: ok'

  log_triage:
    name: GenAgent log triage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.run_examples == 'true') }}
    defaults:
      run:
        working-directory: examples/log_triage
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run example tests
        run: mix test

  consensus_review:
    name: GenAgent consensus review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.run_examples == 'true') }}
    defaults:
      run:
        working-directory: examples/consensus_review
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run example tests
        run: mix test

  claude_repo_review:
    name: GenAgent Claude repository review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.run_examples == 'true') }}
    defaults:
      run:
        working-directory: examples/claude_repo_review
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run example tests
        run: mix test

  packages:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        package:
          - integrations/claude
          - integrations/codex
          - integrations/anthropic
          - integrations/openai
          - extensions/ensemble
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Restore package deps and PLT cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.package }}/deps
            ${{ matrix.package }}/_build
            ${{ matrix.package }}/priv/plts
          key: mix-package-${{ matrix.package }}-1.20-29-${{ hashFiles(format('{0}/mix.lock', matrix.package), format('{0}/mix.exs', matrix.package)) }}
          restore-keys: |
            mix-package-${{ matrix.package }}-1.20-29-

      - name: Run package quality gates
        run: bash "$GITHUB_WORKSPACE/scripts/quality.sh" "${{ matrix.package }}"

  publish-toolchain:
    name: ${{ matrix.package }} / Elixir 1.19 / OTP 27
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package:
          - integrations/claude
          - integrations/codex
          - integrations/anthropic
          - integrations/openai
          - extensions/ensemble
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Restore publish-toolchain deps cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.package }}/deps
            ${{ matrix.package }}/_build
          key: mix-publish-${{ matrix.package }}-1.19-27-${{ hashFiles(format('{0}/mix.lock', matrix.package), format('{0}/mix.exs', matrix.package)) }}
          restore-keys: |
            mix-publish-${{ matrix.package }}-1.19-27-

      - name: Install dependencies
        run: mix deps.get

      - name: Audit dependencies
        run: mix hex.audit

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Build docs
        run: mix docs --warnings-as-errors

      - name: Build Hex archive
        env:
          GEN_AGENT_HEX: "1"
        run: |
          # The earlier path-dependency build and restored cache can leave local
          # sibling sources under deps/ after switching to Hex dependencies.
          mix deps.clean --all
          mix deps.get
          mix hex.build

  packaging:
    name: Hex archives
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [test, docs, packages, publish-toolchain]
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Build all packages with Hex dependencies
        run: scripts/package-check.sh

  published-consumer:
    name: Published package consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Resolve and compile published packages together
        run: scripts/consumer-check.sh

  minimum-core:
    name: ${{ matrix.package }} / minimum Hex core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [claude, codex]
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Test against declared minimum core version
        run: bash scripts/minimum-core-check.sh ${{ matrix.package }}
