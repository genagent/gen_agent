name: Recover Hex publication

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package whose tagged release was not published to Hex
        required: true
        type: choice
        options:
          - .
          - integrations/claude
          - integrations/codex
          - integrations/anthropic
          - integrations/openai
          - extensions/ensemble
      tag:
        description: Existing release tag to publish from
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Prepare tagged package if absent from Hex
        id: prepare
        env:
          PACKAGE: ${{ inputs.package }}
        run: scripts/publish-package.sh "$PACKAGE" prepare

      - name: Publish tagged package if absent from Hex
        if: ${{ steps.prepare.outputs.already_published == 'false' }}
        env:
          PACKAGE: ${{ inputs.package }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: scripts/publish-package.sh "$PACKAGE" publish
