version: 2
updates:
  # One entry for every Mix project so a dependency shared across packages,
  # such as Credo, gets one pull request instead of one per directory.
  - package-ecosystem: mix
    directories:
      - /
      - /integrations/*
      - /extensions/ensemble
    schedule:
      interval: weekly
    groups:
      mix:
        group-by: dependency-name
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
